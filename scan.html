	<section class="flex-grow-1 w-100 h-auto py-2 px-3 overflow-scroll">
		<button type="button" class="btn btn-primary" onclick="turnOnFlashlight()">Light On</button>
		<button type="button" class="btn btn-primary" onclick="turnOffFlashlight()">Light Off</button>

	<div id="log"></div>

	<!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> -->
<!-- 	<script src="./public/bootstrap.bundle.min.js" /> -->

	<script>
	let track = null;

	const myLog = document.getElementById("log");

	function addLog(msg) {
		const p = document.createElement("p");
		p.innerHTML = msg;
		myLog.appendChild(p);
	}

	// 1. Turn Torch ON
	async function turnOnFlashlight() {
	try {
	// Request permission to use the rear camera
	const stream = await navigator.mediaDevices.getUserMedia({
	video: { facingMode: { ideal: 'environment' } }
	});

	// Get the video track
	track = stream.getVideoTracks()[0];

	// Check if the device supports the torch capability
	const capabilities = track.getCapabilities();
	if (!capabilities.torch) {
	alert('Torch is not supported on this device/camera.');
	return;
	}

	// Turn the torch on
	await track.applyConstraints({
	advanced: [{ torch: true }]
	});

	console.log('Flashlight is ON');
	} catch (error) {
	console.error('Error accessing camera or torch:', error);
	}
	}

	// 2. Turn Torch OFF
	async function turnOffFlashlight() {
	if (track) {
	try {
	// Turn the torch off
	await track.applyConstraints({
	advanced: [{ torch: false }]
	});

	// Stop the camera stream to release the hardware
	track.stop();
	track = null;
	console.log('Flashlight is OFF');
	} catch (error) {
	console.error('Error turning off torch:', error);
	}
	}
	}


	</script>
